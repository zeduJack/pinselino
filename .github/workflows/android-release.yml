name: Android test release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Verify project
        run: ./scripts/verify.sh

      - name: Build installable APK
        working-directory: app
        run: flutter build apk --release

      - name: Name APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Pinselino-${{ github.ref_name }}.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "Pinselino-${{ github.ref_name }}.apk"
          --title "Pinselino ${{ github.ref_name }}"
          --notes "Android-Testversion. APK herunterladen und die Installationsanleitung im Repository befolgen."
